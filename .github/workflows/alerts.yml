name: FF Alerts

# cron-job.org starts this workflow every 5 minutes (minutes 4, 9, 14 ... 59),
# Sunday to Friday, 6 AM to 7:59 PM Toronto time.
# GitHub's own timer is removed because it ran late.
#
# To see every alert right now: Actions -> FF Alerts -> Run workflow,
# tick "preview", then Run workflow.

on:
  workflow_dispatch:
    inputs:
      preview:
        description: "Send test copies of every alert now"
        type: boolean
        default: false

permissions:
  contents: write

# one run at a time, so the same alert is never sent twice
concurrency:
  group: ff-alerts
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install requests

      - name: Run the alert script
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PREVIEW: ${{ inputs.preview }}
        run: python ff_alerts.py

      - name: Remember what was already sent
        run: |
          git config user.name  "ff-bot"
          git config user.email "ff-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "state update"
          git push || true
