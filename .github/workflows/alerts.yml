name: FF Alerts

on:
  schedule:
    # 22:00 ET nightly messages.
    # 22:00 ET = 02:00 UTC next day (summer) / 03:00 UTC (winter),
    # so Sun-Thu 22:00 ET lands on Mon-Fri 02:00-03:00 UTC.
    - cron: "*/10 2-3 * * 1-5"

    # 30-minute warnings during the trading day.
    # 10:00-21:59 UTC covers roughly 06:00-17:00 New York all year.
    - cron: "*/5 10-21 * * 1-5"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run the alert script
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python ff_alerts.py

      - name: Save state
        run: |
          git config user.name  "ff-bot"
          git config user.email "ff-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "state update"
          git push || true
